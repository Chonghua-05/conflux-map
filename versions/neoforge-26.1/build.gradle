plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

final File repositoryRoot = projectDir.toPath().resolve('../..').normalize().toFile()
evaluationDependsOn(':common')

sourceSets.main.java.exclude('cn/net/rms/confluxmap/compat/ModMenuIntegration.java')
sourceSets.main.java.exclude('cn/net/rms/confluxmap/mc/input/MaliLib*.java')
sourceSets.main.java.exclude('cn/net/rms/confluxmap/mc/input/LocalizedMaliLibHotkey.java')

// Minecraft 26.1 ships Java 25 to end users.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.neoforged.net/releases' }
}

dependencies {
    implementation(project(':common')) {
        // Minecraft pins its logging API; common uses only APIs also present in that version.
        exclude group: 'org.apache.logging.log4j', module: 'log4j-api'
    }
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'org.nanohttpd:nanohttpd-websocket:2.3.1'
    jarJar 'org.nanohttpd:nanohttpd:2.3.1'
    jarJar 'org.nanohttpd:nanohttpd-websocket:2.3.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // The upstream source tree is preprocessed from the Fabric target and still references a
    // small set of Fabric API types while the NeoForge adapters are being replaced. Keep these
    // artifacts compile-only so they never enter the NeoForge runtime jar.
    compileOnly 'net.fabricmc:fabric-loader:0.19.0'
    compileOnly 'net.fabricmc.fabric-api:fabric-api:0.155.2+26.1.2'
}

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
    }
    // Buffer/identifier tests need the game API but do not initialize a Minecraft instance.
    addModdingDependenciesTo sourceSets.test
}

processResources {
    from(new File(repositoryRoot, 'src/main/resources')) { include 'assets/**' }
    from(new File(repositoryRoot, 'native/prebuilt')) { into 'natives' }
}

jar {
    from project(':common').sourceSets.main.output
    from(new File(repositoryRoot, 'LICENSE'))
}

test { useJUnitPlatform() }
check.dependsOn ':common:check'

// The standalone settings file avoids resolving every Fabric version during a NeoForge build.
// common's native test resources normally use the outer root project's directory.
project(':common').tasks.named('processTestResources') {
    from(new File(repositoryRoot, 'native/prebuilt')) { into 'natives' }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(ProcessResources).configureEach {
    final Map<String, Object> replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
