name: Cache Refresh
on:
  schedule:
    - cron: '0 2 */5 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  Get-Versions:
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.Get_Versions.outputs.versions }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Get Minecraft versions
        id: Get_Versions
        run: |
          VERSIONS=$(find versions -maxdepth 1 -type d -name "[0-9]*.[0-9]*" | xargs -I {} basename {} | sort -V | jq -R . | jq -s -c .)
          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT

  Refresh-Matrix:
    # One job refreshes the single unified cache (same key as check.yml's
    # Build-Matrix): it walks every version so the entry covers the whole
    # preprocessor chain plus each version's client assets, which the matrix
    # jobs' Connect steps otherwise re-download from Mojang on cold caches.
    runs-on: ubuntu-24.04
    needs: Get-Versions
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '22'
          distribution: 'temurin'
      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-unified-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-unified-
            ${{ runner.os }}-gradle-
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Refresh cache for every Minecraft version
        env:
          VERSIONS: ${{ needs.Get-Versions.outputs.versions }}
        run: |
          for version in $(echo "$VERSIONS" | jq -r '.[]'); do
            ./gradlew ":$version:dependencies" ":$version:downloadAssets"
          done
      - name: Stop Gradle daemon
        if: always()
        run: ./gradlew --stop

  Refresh-Paper:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '22'
          distribution: 'temurin'
      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-paper-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-paper-
            ${{ runner.os }}-gradle-
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Refresh Paper cache
        run: ./gradlew :paper:dependencies
      - name: Stop Gradle daemon
        if: always()
        run: ./gradlew --stop
