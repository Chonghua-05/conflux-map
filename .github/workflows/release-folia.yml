name: Release Folia Companion

on:
  push:
    tags:
      - 'v*-folia'
  workflow_dispatch:
    inputs:
      plugin_version:
        description: Folia plugin version without a v prefix
        required: true
        default: '0.1.4'
        type: string
      release_tag:
        description: GitHub release tag
        required: true
        default: 'v0.1.4-folia'
        type: string

permissions:
  contents: write

concurrency:
  group: release-folia-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  Release-Folia:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Validate release identifiers
        id: release
        env:
          DISPATCH_VERSION: ${{ inputs.plugin_version }}
          DISPATCH_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
            PLUGIN_VERSION="${RELEASE_TAG#v}"
            PLUGIN_VERSION="${PLUGIN_VERSION%-folia}"
          else
            PLUGIN_VERSION="$DISPATCH_VERSION"
            RELEASE_TAG="$DISPATCH_TAG"
          fi
          [[ "$PLUGIN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_TAG" == "v${PLUGIN_VERSION}-folia" ]]
          echo "plugin_version=$PLUGIN_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Build Folia companion
        env:
          PLUGIN_VERSION: ${{ steps.release.outputs.plugin_version }}
        run: ./gradlew "-Pversion=$PLUGIN_VERSION" :paper:build
      - name: Prepare release files
        env:
          PLUGIN_VERSION: ${{ steps.release.outputs.plugin_version }}
        run: |
          set -euo pipefail
          mkdir release-files
          cp "paper/build/libs/confluxmap-paper-${PLUGIN_VERSION}.jar" \
            "release-files/confluxmap-folia-${PLUGIN_VERSION}.jar"
          cat > release-notes.md <<EOF
          ## Conflux Map Folia companion v${PLUGIN_VERSION}

          - Runtime verified: Folia 26.1.2 (Minecraft 26.1 through 26.1.2) with Java 25.
          - Includes map synchronisation, shared waypoints, the optional web map, and graceful shutdown support for Folia's regionised scheduler model.
          - **Chunk load state maps are unavailable on Folia.** The `shareChunkLoadState` setting is ignored and the feature remains disabled.

          ---

          ## Conflux Map Folia 服务端组件 v${PLUGIN_VERSION}

          - 已验证运行环境：Folia 26.1.2（Minecraft 26.1 至 26.1.2）和 Java 25。
          - 支持地图同步、共享路径点、可选网页地图，并适配 Folia 的区域化调度模型和正常停机流程。
          - **Folia 不支持区块加载票地图。** `shareChunkLoadState` 配置会被忽略，该功能始终保持禁用。
          EOF
      - name: Upload release artifact
        uses: actions/upload-artifact@v5
        with:
          name: confluxmap-folia-${{ steps.release.outputs.plugin_version }}
          path: release-files/confluxmap-folia-${{ steps.release.outputs.plugin_version }}.jar
          if-no-files-found: error
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_VERSION: ${{ steps.release.outputs.plugin_version }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release-files/*.jar \
            --target "$GITHUB_SHA" \
            --title "Conflux Map Folia companion v${PLUGIN_VERSION}" \
            --notes-file release-notes.md
