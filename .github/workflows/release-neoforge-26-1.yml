name: NeoForge 26.1 Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-neoforge-26.1-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-neoforge-26.1-
            ${{ runner.os }}-gradle-

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build and test NeoForge 26.1
        run: ./gradlew :neoforge-26.1:build --no-daemon --console=plain

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^mod_version=//p' versions/neoforge-26.1/gradle.properties)
          if [[ -z "$version" ]]; then
            echo 'NeoForge mod_version is empty' >&2
            exit 1
          fi
          tag="v$version"
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match NeoForge version $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          jar=$(find versions/neoforge-26.1/build/libs -maxdepth 1 -type f -name '*.jar' | head -n 1)
          if [[ -z "$jar" ]]; then
            echo 'NeoForge JAR was not produced' >&2
            exit 1
          fi
          notes=$(mktemp)
          cat > "$notes" <<'EOF'
          Conflux Map v0.1.4 for NeoForge 26.1.

          Install the JAR in the client or server `mods/` directory. Fabric API and MaliLib are not required for this build.
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$jar" --clobber
            gh release edit "$RELEASE_TAG" --title "Conflux Map $RELEASE_TAG (NeoForge 26.1)" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" "$jar" --title "Conflux Map $RELEASE_TAG (NeoForge 26.1)" --notes-file "$notes"
          fi
